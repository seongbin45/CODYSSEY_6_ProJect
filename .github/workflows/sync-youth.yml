name: sync-youth

on:
  schedule:
    # 매일 03:00, 15:00 KST (UTC 18:00, 06:00)
    - cron: "0 18 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youth
  cancel-in-progress: false

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch full 온통청년 list
        env:
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
        run: |
          if [ -z "$YOUTH_API_KEY" ]; then
            echo "YOUTH_API_KEY 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 넣어 주세요."
            exit 1
          fi
          python scripts/sync_youth.py

      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youth_policy_snapshot.json
          if git diff --staged --quiet; then
            echo "스냅샷 변화 없음"
          else
            git commit -m "chore: 온통청년 정책 스냅샷 갱신"
            git push
          fi
